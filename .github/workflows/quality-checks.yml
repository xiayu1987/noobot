name: Quality Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --test-skip-pattern=@performance

jobs:
  commit-identity:
    name: Commit identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete commit history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
      - name: Reject unapproved authors, committers and co-authors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/check-commit-identity.mjs --range "$HEAD_SHA"
          else
            git fetch --no-tags origin "$BASE_SHA"
            git fetch --no-tags origin "$HEAD_SHA"
            node scripts/check-commit-identity.mjs --range "$BASE_SHA..$HEAD_SHA"
          fi

  quality:
    name: Quality (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.21.0
          - 26.9.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci && npm run -s install:mcp-test-service

      - name: Verify Linux native script runtime contract
        run: node scripts/run-with-isolated-tmp.mjs node --test agent/__tests__/tools/native-script-platform.test.js

      - name: Run lightweight code quality checks
        run: npm run check:quality

      - name: Verify Bash orchestration with command doubles
        run: npm run test:e2e:docker-orchestration

      - name: Run repository regression tests
        run: npm test

      - name: Build production clients
        run: npm run build

  windows-session-storage:
    name: Native Windows session storage
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify native Windows process tree ownership and termination
        run: >-
          node scripts/run-with-isolated-tmp.mjs node --test
          platform-compatibility/__tests__/process-termination.test.js
          agent/__tests__/tools/native-script-platform.test.js
          agent/__tests__/tools/process-exec.test.js
          service/__tests__/deletion-worker-process.test.js
          client/shared/tests/electron/desktop-services-startup.test.js

      - name: Verify Windows journal removal locks
        run: npm run -w agent test:windows:session-storage

      - name: Verify native storage durability and scoped locks
        run: >-
          node scripts/run-with-isolated-tmp.mjs node --test
          agent/__tests__/session/execution-log-windows-durability.test.js
          agent/__tests__/session/partition-journal-processes.test.js
          agent/__tests__/session/partition-service-admission.test.js
          agent/__tests__/workspace-partition-format-upgrade.test.js
          agent/__tests__/workspace-session-storage-retirement.test.js
          session-protocol/__tests__/session-reader-access.test.js
