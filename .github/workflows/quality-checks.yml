name: Quality Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.21.0
          - 26.9.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify Linux native script runtime contract
        run: node --test agent/__tests__/tools/native-script-platform.test.js

      - name: Run lightweight code quality checks
        run: npm run check:quality

      - name: Run repository regression tests
        run: npm test

      - name: Build production clients
        run: npm run build
