name: Quality Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.21.0
          - 26.9.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci && npm run -s install:mcp-test-service

      - name: Verify Linux native script runtime contract
        run: node scripts/run-with-isolated-tmp.mjs node --test agent/__tests__/tools/native-script-platform.test.js

      - name: Run lightweight code quality checks
        run: npm run check:quality

      - name: Run repository regression tests
        run: npm test

      - name: Build production clients
        run: npm run build

  windows-session-storage:
    name: Native Windows session storage
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.9.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify native storage durability and scoped locks
        run: >-
          node scripts/run-with-isolated-tmp.mjs node --test
          agent/__tests__/session/execution-log-windows-durability.test.js
          agent/__tests__/session/immutable-windows-durability.test.js
          agent/__tests__/session/scoped-session-repositories.test.js
          agent/__tests__/workspace-isolated-immutable-migration.test.js
          agent/__tests__/workspace-session-directory-walk.test.js
          agent/__tests__/workspace-session-storage-upgrade.test.js
          session-protocol/__tests__/session-reader-access.test.js
