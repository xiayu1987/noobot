name: Quality Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lightweight code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Linux native script runtime contract
        run: node --test agent/__tests__/tools/native-script-platform.test.js

      - name: Run lightweight code quality checks
        run: npm run check:quality
